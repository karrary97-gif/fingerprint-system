<style>
:root{--c:#156b5c;--c2:color-mix(in srgb,var(--c) 66%,#000);--gold:#b8963e;--gold2:#e3c878;--bg:#f5f2e9;--card:#fff;--tx:#17302b;--mut:#6a7a75;--bd:#e6dfcd;--fs:15px;--ff:'Cairo',sans-serif;--ok:#15803d;--bad:#b91c1c;--warn:#b45309;--tint:color-mix(in srgb,var(--c) 9%,var(--card))}
body.dark{--bg:#0c1815;--card:#13241f;--tx:#e8efe9;--mut:#9bb0a8;--bd:#25403a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:radial-gradient(circle at 12% 8%,color-mix(in srgb,var(--gold) 14%,transparent),transparent 38%),radial-gradient(circle at 92% 90%,color-mix(in srgb,var(--c) 12%,transparent),transparent 40%);background-attachment:fixed;color:var(--tx);font-family:var(--ff);font-size:var(--fs);min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:inherit}
header.top{background:linear-gradient(135deg,var(--c2),var(--c));color:#fff;padding:12px 22px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between;border-bottom:4px solid var(--gold);box-shadow:0 4px 18px rgba(0,0,0,.15)}
.brand{display:flex;align-items:center;gap:14px}
header.top h1{margin:0;font-size:1.1em;font-weight:700}
header.top.adm{padding:10px 22px}header.top.adm .admw{font-size:1.05em}
header.top small{opacity:.92;display:block;color:var(--gold2)}
.logo{width:58px;height:58px;border-radius:50%;border:3px solid var(--gold);background:#fff;object-fit:cover;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.logo.lg{width:130px;height:130px;border-width:4px}
.clock{font-weight:700;direction:ltr;text-align:center;background:rgba(255,255,255,.13);border:1px solid var(--gold);padding:6px 16px;border-radius:30px;font-size:.92em}
.wrap{max-width:1250px;margin:0 auto;padding:18px}
.hero{text-align:center;padding:26px 10px 8px}
.hero .logo{width:150px;height:150px;border-width:5px;animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
.hero h2{margin:14px 0 4px;color:var(--c);font-size:1.7em}
.hero p{margin:0;color:var(--mut)}
.hero .div{width:90px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--gold2));margin:12px auto}
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:18px}
.role{background:var(--card);border:1px solid var(--bd);border-bottom:4px solid var(--c);border-radius:16px;padding:24px 14px;text-align:center;cursor:pointer;transition:.18s;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.role:hover{border-bottom-color:var(--gold);transform:translateY(-4px);box-shadow:0 12px 26px rgba(21,107,92,.18)}
.role .ic{display:flex;width:68px;height:68px;margin:0 auto 10px;align-items:center;justify-content:center;font-size:1.9em;border-radius:50%;background:linear-gradient(135deg,var(--tint),var(--card));border:2px solid var(--gold)}
.card{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--gold);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.card h3{margin:0 0 14px;color:var(--c);display:flex;align-items:center;gap:8px}
.card h3::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--gold),transparent);opacity:.5}
.login{max-width:420px;margin:24px auto}
label{display:block;margin:10px 0 4px;font-weight:600;color:var(--c2)}
body.dark label{color:var(--gold2)}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:9px;background:var(--card);color:var(--tx);transition:.15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 20%,transparent)}
input[type=checkbox],input[type=radio],input[type=color]{width:auto}
input[type=color]{height:38px;padding:2px}
.btn{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;border:0;border-radius:9px;padding:9px 18px;cursor:pointer;font-weight:600;margin:4px 0 4px 6px;box-shadow:0 2px 6px rgba(21,107,92,.25);transition:.15s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.sec{background:transparent;color:var(--c);border:1.5px solid var(--c);box-shadow:none}
body.dark .btn.sec{color:var(--gold2);border-color:var(--gold)}
.btn.red{background:linear-gradient(135deg,#c0392b,var(--bad))}
.btn.sm{padding:4px 11px;font-size:.84em}
.btn:disabled{opacity:.5}
hr{border:0;border-top:1px dashed var(--bd);margin:14px 0}
.app{display:flex;gap:18px;align-items:flex-start}
nav.side{flex:0 0 238px;background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--gold);border-radius:14px;padding:8px;position:sticky;top:10px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
nav.side button{display:block;width:100%;text-align:right;background:none;border:0;border-right:4px solid transparent;padding:11px 12px;border-radius:9px;color:var(--tx);cursor:pointer;margin:3px 0;font-weight:500;transition:.15s}
nav.side button.on{background:linear-gradient(270deg,var(--c),var(--c2));color:#fff;font-weight:700;border-right-color:var(--gold)}
nav.side button:hover:not(.on){background:var(--tint)}
main{flex:1;min-width:0}
.tw{overflow-x:auto;border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.93em}
th,td{border:1px solid var(--bd);padding:7px 10px;text-align:right;white-space:nowrap}
th{background:var(--tint);color:var(--c2);border-bottom:2px solid var(--gold)}
body.dark th{color:var(--gold2)}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--c) 3%,transparent)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--tint);border-radius:12px;padding:14px;text-align:center;border-bottom:3px solid var(--gold)}
.kpi b{display:block;font-size:1.8em;color:var(--c)}
body.dark .kpi b{color:var(--gold2)}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.82em;background:var(--tint)}
.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}.tag.warn{color:var(--warn)}
.bar{height:14px;background:linear-gradient(90deg,var(--c),var(--gold));border-radius:4px;min-width:2px}
.msg{padding:10px 14px;border-radius:10px;margin:10px 0;background:#e6f4f1;color:#0b4f48;border-right:4px solid var(--c)}
.msg.err{background:#fde8e8;color:#8a1c1c;border-right-color:var(--bad)}
body.dark .msg{background:#12342f;color:#bfe9e2}
body.dark .msg.err{background:#3b1717;color:#f5b5b5}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal .card{width:100%;max-width:430px;margin:0}
pre.code{background:#0d1117;color:#d6e2f0;padding:12px;border-radius:8px;overflow:auto;max-height:300px;direction:ltr;text-align:left;font-size:12px;white-space:pre}
footer{text-align:center;color:var(--mut);padding:20px;font-size:.88em}
footer b{color:var(--c)}
footer .gl{width:60px;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold2));margin:0 auto 10px;border-radius:3px}
#printArea{display:none}
.menubtn,.ov{display:none}
@media(max-width:800px){.app{flex-direction:column}.menubtn{display:block;width:100%;text-align:right;margin:0 0 12px}nav.side{position:fixed;top:0;right:0;bottom:0;width:270px;max-width:80vw;border-radius:0;z-index:40;overflow-y:auto;transform:translateX(105%);transition:transform .2s;padding-top:14px}body.menu nav.side{transform:none}body.menu .ov{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:39}main{width:100%}.logo{width:46px;height:46px}.hero .logo{width:120px;height:120px}}
.gs{position:relative;flex:1 1 230px;max-width:340px}.gs input{background:rgba(255,255,255,.15);border:1px solid var(--gold);color:#fff;border-radius:30px}.gs input::placeholder{color:#e9efe9}
#gsr{position:absolute;top:100%;right:0;left:0;margin-top:4px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden}
#gsr:empty{display:none}.gsi{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--bd)}.gsi:hover{background:var(--tint)}.gsi small{color:var(--mut)}
button.kpi{border:0;font:inherit;color:inherit;width:100%}.kpi.click{cursor:pointer;transition:.15s}.kpi.click:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.12)}.kpi small{display:block;font-size:.72em;color:var(--mut);margin-top:3px;white-space:normal}
.qa{display:flex;flex-wrap:wrap;gap:6px}.al{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:10px;margin:8px 0;background:var(--tint);border-right:5px solid var(--gold)}
.al.high{border-right-color:var(--bad)}.al.med{border-right-color:var(--warn)}.modal .card.wide{max-width:920px;max-height:90vh;overflow:auto}.card h4{margin:14px 0 6px;color:var(--c2)}
/* ===== المحور 17: تحسينات الواجهة وإمكانية الوصول ===== */
:focus-visible{outline:3px solid #b8963e;outline-offset:2px}
.tt{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}.tt input{max-width:240px}.tt .tc{color:var(--mut);font-size:.85em}
th[data-sort]{cursor:pointer;user-select:none}th[data-sort]::after{content:' ↕';opacity:.45}th[aria-sort=ascending]::after{content:' ▲';opacity:1}th[aria-sort=descending]::after{content:' ▼';opacity:1}
.bell{background:none;border:1px solid var(--bd);border-radius:20px;padding:4px 10px;cursor:pointer;font-size:1.05em;margin:0 6px}.bell b{background:#b00;color:#fff;border-radius:10px;font-size:.7em;padding:1px 6px;margin-right:4px}
.ntf{border-right:5px solid var(--bd);padding:8px 12px;margin:6px 0;background:var(--tint);border-radius:8px}.ntf.bad{border-color:#b00}.ntf.warn{border-color:#c80}.ntf.info{border-color:#27a}.ntf small{color:var(--mut)}
.msg[role=alert]{font-weight:600}
@media(max-width:640px){.row{display:block}.row>div{margin-bottom:8px;width:100%}.btn{min-height:44px}input,select{min-height:42px;font-size:16px}.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}.card{padding:12px}.tt input{max-width:100%;width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{body.printing>*:not(#printArea){display:none!important}body.printing{background:#fff}body.printing #printArea{display:block;background:#fff;color:#000}#printArea table{font-size:11px}#printArea th{background:#eee;color:#000;border-bottom:2px solid #b8963e}}

/* v10: إشعار عائم + أحجام الصفحات + وضوح الحالات */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:9999;max-width:min(92vw,560px);padding:12px 18px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.28);display:none;line-height:1.7;text-align:center}
.toast.ok{background:#0b4f48;color:#fff}.toast.err{background:#b42318;color:#fff}
.pgz{display:inline-flex;align-items:center;gap:6px;font-size:.85em;color:var(--mut);margin:0}.pgz select{width:auto;min-width:72px;padding:4px 8px;min-height:0}
.tt{justify-content:flex-start}
.tag.ok{background:rgba(21,128,61,.14)}.tag.bad{background:rgba(185,28,28,.14)}.tag.warn{background:rgba(180,83,9,.16)}
.tw td .tag{white-space:nowrap;font-size:.88em}.tw td select{min-width:150px;max-width:210px}

<script type="text/plain" id="gs-code">
// v3.8: + حقل «حارس ليلي» للموظف (عمود جديد بالافتراضي لا) مع أوقات الحارس الليلي ونظام البديل في إعدادات الدوام (work.night*). شغّل setup مرة واحدة بعد اللصق (آمن) ثم أعد النشر.
// v3.7: + «ربط البصمات» (ورقة FpMap): رقم البصمة لكل موظف حسب الجهاز (أجهزة متعددة بأرقام مختلفة) مع اتجاه الجهاز (دخول/خروج/كلاهما) ونافذة وقت اختيارية (للحراس) + مفتاح الحركة صار (الرقم+الوقت+الجهاز) فلا تتصادم أرقام الأجهزة المختلفة + ربط بصمة غير مطابقة يتم لجهاز محدد + إلغاء انتهاء الجلسة بالخمول كليًا (الجلسات تُحفظ أيضًا في خصائص السكربت فلا تضيع بتفريغ الذاكرة المؤقتة) + عمود «اتجاه البصمة» للجهاز. شغّل setup مرة واحدة بعد اللصق (آمن) ثم أعد النشر.
// v3.6: + نقل نوافذ وصلاحيات الموارد البشرية لمسؤول البصمة (تبقى لمسؤول الموارد أيضًا) + حقل «نوع العقد» للموظف (عمود جديد: شغّل setup مرة واحدة ثم أعد النشر)
// ===== نظام البصمة - Code.gs v3.5 : جوجل شيت هو المصدر الوحيد للبيانات =====
// v3.5: + النسخ الاحتياطي ملف Excel (.xlsx) يوميًا عند منتصف الليل (12:00 ص) مع تنزيله من الواجهة (إجراء bkdl) + إلغاء الملخص البريدي كليًا (dailyDigest/MailApp) + إلغاء فحص السلامة والأرشفة (dbstats/archive/unarchive) + رقم بصمة ثانٍ للموظف (fpId2) يُطابَق ويُمنع تكراره كالأول + عمود «الساعات» للحالات (الإجازة الزمنية: كل 6 ساعات = يوم) + نوع حركة رصيد «خصم زمنيات». شغّل setup مرة واحدة بعد اللصق (آمن: يضيف أعمدة ولا يمسّ البيانات) ثم أعد النشر. ملاحظة: التصدير إلى Excel يستخدم UrlFetchApp فستُطلب صلاحية جديدة عند أول تشغيل.
// v3.4 (المحور 3 - الحضور وحركات البصمة + المحور 4 - الموظفون والبيانات الوظيفية): + سجل مركزي للحركات (طريقة الاستيراد/وقت الاستلام) + سجل مستبعد (PunchLog) للمكرر والمحذوف + ربط بصمة غير مطابقة بموظف بإجراء موثّق (linkfp) + تصحيحات حضور لا تمسّ الحركة الأصلية وتحتاج اعتمادًا (Corrections) + فصل الطلب عن الاعتماد + سجل انتقالات الموظف (Movements) + حالة الخدمة وتواريخها + منع تكرار رقم الموظف/البصمة على الخادم + رقم الأمر الإداري للحالات. أعد تشغيل setup مرة واحدة (آمن: يضيف أوراقًا وأعمدة ولا يمسّ البيانات).
// v3.3 (المحور 2 - الحسابات والصلاحيات، مكتمل): + انتهاء صلاحية كلمة السر (Settings: set.pwDays) + منع إعادة استخدام آخر 5 كلمات سر + تخزين hash مغلّف بمفتاح الخادم (نسخ Drive لا تصلح للدخول) + تعطيل مؤقت بمدة + إنهاء جلسات مستخدم. السابق: صلاحيات تفصيلية تُفرض على الخادم عند الحفظ (لا يكفي إخفاء الأزرار)، منع تسريب hash كلمات السر لغير صاحبها، إبطال الجلسات عند تغيير كلمة السر/التعطيل/تغيير الصفة، انتهاء الجلسة بالخمول، إجراء logout حقيقي، قفل تدريجي، حماية آخر أدمن، وسجل خادم موثوق للعمليات الحساسة. أعد تشغيل setup مرة واحدة (يضيف 4 أعمدة لورقة Users ولا يمسّ البيانات).

  Object.keys(HD).forEach(function (n) {

}

function addLog_(u, role, a) { var s = sh_('Logs'); setTxt_(s, s.getLastRow() + 1, [[nowS_(), u, role, a]]); P_.deleteProperty('H_Logs'); }
function mergeLogs_(db, u) { // السجل للإضافة فقط: لا حذف ولا تعديل لسجلات الخادم، ونسب أي سجل جديد للمستخدم الحقيقي (الجلسة) لا لما يدّعيه المتصفح

#!/usr/bin/env python3
# -*- coding: utf-8 -*-
"""
fp_bridge.py v6.1 : وسيط بايثون بين أجهزة البصمة (FingerTec / ZK) عبر الشبكة المحلية LAN ونظام البصمة (Google Apps Script)

طريقة الاتصال الوحيدة: وسيط بايثون + كيبل/شبكة LAN. (أُلغيت ملفات USB ومجلد الاستيراد.)

يسحب من كل الأجهزة المفعّلة (FaceID-1 ثم 2 ثم 3 ...) ويرسل كل حركة مع اسم جهازها؛ والنظام يدمج بصمات الأجهزة
في سطر واحد لكل موظف في كل يوم (اتحاد/تقاطع) ويربط الرقم بالموظف حسب (الجهاز + الرقم) من «ربط البصمات».
القراءة من الجهاز (LAN) منفصلة عن الإرسال للخادم: الحركات تُحفظ أولًا في fp_outbox.json ثم تُرسل عند توفر الإنترنت
(لا تضيع حركة ولا تتكرر).

التثبيت (مرة واحدة):
    pip install pyzk requests
    ضع مفتاح الجسر (من الدالة showKey في السكربت) في ملف fp_key.txt بجانب هذا الملف (64 حرفًا).

الأوامر:
    python fp_bridge.py --test               فحص كل شيء (الخادم، المفتاح، الأجهزة، ساعة الجهاز) — شغّله أولًا
    python fp_bridge.py                      سحب من كل الأجهزة ثم إرسال (للجدولة كل 15-30 دقيقة)
    python fp_bridge.py --collect            قراءة الأجهزة وحفظها محليًا فقط (بلا إنترنت)
    python fp_bridge.py --flush [--wait N]   إرسال المحفوظ محليًا (ينتظر الإنترنت حتى N دقيقة)
    python fp_bridge.py --sync --wait 10     اسحب الآن ثم انتظر حتى 10 دقائق لتفصل الكيبل ويعود الإنترنت
    python fp_bridge.py --serve              زر «سحب من الأجهزة» في الصفحة (يتحقق من توكن الجلسة)
    python fp_bridge.py --loop [دقائق]       خدمة مستمرة (الافتراضي 15 دقيقة) وتكتب fp_status.json
    python fp_bridge.py --install-task [د]   (ويندوز) تشغيل عند الدخول + حارس كل 30 دقيقة
    python fp_bridge.py --remove-task        إزالة المهمتين
    python fp_bridge.py --status             آخر تشغيل/نجاح/خطأ وحالة كل جهاز والحركات المنتظرة

الأجهزة: تُقرأ من تبويب «أجهزة البصمة» في النظام (طريقة «وسيط بايثون») وتُحفظ نسخة محلية (fp_devices_cache.json)،
وإلا فمن "devices" في fp_config.json. الاسم يجب أن يطابق اسم الجهاز في النظام تمامًا.

fp_config.json (اختياري):

def setup_log():

    fh = RotatingFileHandler(os.path.join(HERE, "fp_bridge.log"), maxBytes=1000000, backupCount=5, encoding="utf-8")

    for h in (fh, sh):

        raise RuntimeError("ملف fp_key.txt غير موجود بجانب fp_bridge.py (المفتاح يظهر عند تشغيل showKey في السكربت)")

def load_state():
    try:
        with open(STATE, encoding="utf-8") as f:
            return json.load(f)
    except Exception:
        return {}


def save_state(st):
    tmp = STATE + ".tmp"
    with open(tmp, "w", encoding="utf-8") as f:
        json.dump(st, f, ensure_ascii=False)
    os.replace(tmp, STATE)  # كتابة ذرّية: لا يتلف الملف إن انقطعت الكهرباء


def _read_json(path, default):
    try:
        with open(path, encoding="utf-8") as f:
            return json.load(f)
    except Exception:
        return default


def _write_json(path, obj):
    tmp = path + ".tmp"
    with open(tmp, "w", encoding="utf-8") as f:
        json.dump(obj, f, ensure_ascii=False)
    os.replace(tmp, path)


def online(timeout=6):
    """فحص سريع: هل يصل هذا الكمبيوتر لخادم النظام الآن؟ (يتغير عند توصيل/فصل كيبل الجهاز)"""
    try:
        requests.get(CFG["url"], timeout=timeout)
        return True
    except Exception:
        return False


def wait_online(minutes):
    """ينتظر عودة الإنترنت (مثلًا بعد فصل كيبل الجهاز) حتى minutes دقيقة. يرجع True إن توفر."""
    if online():
        return True
    end = time.time() + max(0, minutes) * 60
    if minutes > 0:
        log.info("لا يوجد إنترنت الآن. أنتظر عودته حتى %d دقيقة (افصل كيبل الجهاز أو أعد توصيل الإنترنت)…", minutes)
    while time.time() < end:
        time.sleep(5)
        if online(4):
            log.info("عاد الإنترنت")
            return True
    return False


def outbox_load():
    return _read_json(OUTBOX, {"rows": []}).get("rows", [])


def outbox_save(rows):
    _write_json(OUTBOX, {"rows": rows})


def outbox_add(rows):
    """يضيف حركات لصندوق الإرسال المحلي دون تكرار (الرقم+الوقت+الجهاز). يرجع عدد المضاف فعلًا"""
    cur = outbox_load()
    have = set((r[0], r[1], r[2]) for r in cur)
    n = 0
    for r in rows:
        k = (r[0], r[1], r[2])
        if k not in have:
            have.add(k)
            cur.append([r[0], r[1], r[2]])
            n += 1
    if n:
        outbox_save(cur)
    return n


# ====================== الاتصال بالخادم ======================
def call(action, retries=3, **data):
    body = json.dumps(dict(data, action=action)).encode("utf-8")
    last = None
    for i in range(retries):
        try:
            j = requests.post(CFG["url"], data=body, timeout=120).json()
        except Exception as e:
            last = e
            time.sleep(3 * (i + 1))
            continue
        if j.get("ok"):
            return j
        last = RuntimeError(j.get("err") or "فشل")
        if j.get("err") in ("unauthorized", "forbidden"):
            if j.get("err") == "unauthorized":
                last = RuntimeError("unauthorized: مفتاح fp_key.txt لا يطابق مفتاح السكريبت الحالي؛ شغّل showKey في Apps Script وانسخ المفتاح إلى fp_key.txt")
            break  # لا فائدة من التكرار
        time.sleep(3 * (i + 1))
    raise last


def post_rows(rows, key):
    """يرجع إحصاءات الإرسال: added جديدة، dups مكررة مريبة سُجّلت بالخادم، resent معادة، bad مرفوضة"""
    t = {"added": 0, "dups": 0, "resent": 0, "bad": 0}
    for i in range(0, len(rows), 2000):
        j = call("punches", k=key, rows=rows[i:i + 2000])
        t["added"] += j.get("added", 0)
        t["dups"] += j.get("dups", 0)
        t["resent"] += j.get("resent", 0)
        t["bad"] += j.get("skipped", 0)
    return t


def classify(e):
    """تصنيف الخطأ لتحديد سياسة إعادة المحاولة وتسهيل التشخيص في سجل الأجهزة"""
    s = str(e).lower()
    if isinstance(e, requests.exceptions.Timeout) or "timed out" in s or "timeout" in s:
        return "timeout"
    if "unauthorized" in s or "forbidden" in s:
        return "auth"
    if "pyzk" in s or "مكتبة" in str(e):
        return "lib"
    if "تعذر الاتصال" in str(e) or "refused" in s or "unreachable" in s or "no route" in s:
        return "unreachable"
    if isinstance(e, requests.exceptions.RequestException):
        return "server_net"
    if "تاريخ" in str(e) or "غير صالح" in str(e):
        return "bad_data"
    return "other"


def cooldown(fails):
    """بعد 3 إخفاقات متتالية لجهاز: ننتظر 5 ثم 10 ثم 20… حتى 120 دقيقة بدل إغراق جهاز/شبكة معطلة"""
    return 0 if fails < 3 else min(120, 5 * (2 ** (fails - 3)))


def read_status():
    try:
        with open(STATUS, encoding="utf-8") as f:
            return json.load(f)
    except Exception:
        return {}


def write_status(items, ok, err=""):
    s = read_status()
    now = time.strftime("%Y-%m-%d %H:%M:%S")
    s.update({"version": VERSION, "mode": MODE, "pid": os.getpid(), "host": socket.gethostname(), "last_run": now, "items": items})
    if ok:
        s["last_success"] = now
        s["fails"] = 0
        s["last_error"] = ""
    else:
        s["fails"] = int(s.get("fails", 0)) + 1
        s["last_error"] = err or "; ".join("%s: %s" % (i["name"], i.get("err", "")) for i in items if not i.get("ok"))
    tmp = STATUS + ".tmp"
    with open(tmp, "w", encoding="utf-8") as f:
        json.dump(s, f, ensure_ascii=False)
    os.replace(tmp, STATUS)
    return s


def report(items, key, hb=None):  # حالة آخر سحب لكل جهاز + نبضة الخدمة تظهر في تبويب الأجهزة بالنظام
    try:
        s = read_status()
        beat = hb or {"v": VERSION, "host": socket.gethostname(), "mode": MODE, "err": s.get("last_error", ""), "okts": s.get("last_success", ""), "fails": s.get("fails", 0)}
        call("bridge", retries=1, k=key, items=items, hb=beat)
    except Exception as e:
        log.debug("تعذر إرسال الحالة: %s", e)


# ====================== الطريقة 1: الأجهزة عبر الشبكة (ZK) ======================
DEV_LOCKS = {}
_LK = threading.Lock()


def dev_lock(name):  # قفل لكل جهاز: تُقرأ الأجهزة الثلاثة بالتوازي دون تداخل على الجهاز نفسه
    with _LK:
        return DEV_LOCKS.setdefault(name, threading.Lock())


def get_devices(auth):
    """auth = {"k": مفتاح} للمجدول، أو {"t": توكن} لزر الصفحة. بدون إنترنت: النسخة المحفوظة ثم fp_config.json"""
    devs = None
    try:
        r = call("devices", retries=1, **auth)
        devs = [d for d in r.get("devices", []) if "بايثون" in str(d.get("method", ""))]
        if devs:
            _write_json(DEV_CACHE, devs)
    except Exception as e:
        log.warning("تعذر جلب قائمة الأجهزة من الخادم (%s): أستخدم النسخة المحفوظة/fp_config.json", str(e)[:80])
    if not devs:
        devs = _read_json(DEV_CACHE, []) or [dict(d) for d in CFG["devices"]]
    return [{
        "name": str(d.get("name")),
        "ip": str(d.get("ip")),
        "port": int(d.get("port") or 4370),
        "password": int(CFG["comm_keys"].get(str(d.get("name")), 0) or 0),
        "driver": str(d.get("driver") or "zk"),
    } for d in devs]


def connect(dev):
    if ZK is None:
        raise RuntimeError("مكتبة pyzk غير مثبتة: pip install pyzk")
    last = None
    proto = _read_json(PROTO_FILE, {})
    first = bool(proto.get(dev["name"], False))  # آخر بروتوكول نجح (False = TCP)
    for udp in (first, not first):  # بعض الأجهزة تردّ على UDP فقط
        for attempt in range(3):  # الجهاز يقبل اتصالًا واحدًا: إن كان مشغولًا أو بقيت جلسة قديمة يقطع الاتصال (WinError 10054) فنعيد بعد مهلة
            try:
                c = ZK(dev["ip"], port=dev["port"], timeout=12, password=dev["password"],
                       force_udp=udp, ommit_ping=True).connect()
                if proto.get(dev["name"]) != udp:
                    proto[dev["name"]] = udp
                    try:
                        _write_json(PROTO_FILE, proto)
                    except Exception:
                        pass
                return c
            except Exception as e:
                last = e
                m = str(e).lower()
                if attempt < 2 and ("10054" in m or "forcibly" in m or "reset" in m or "busy" in m or "unauthenticated" in m):
                    time.sleep(3 + attempt * 3)
                    continue
                break
    raise RuntimeError("تعذر الاتصال بـ %s:%s (%s). تحقق من IP والشبكة والمنفذ وكلمة الاتصال Comm Key، وأن لا برنامج آخر (ZKTime/نسخة ثانية من الوسيط) متصل بالجهاز في الوقت نفسه" % (dev["ip"], dev["port"], last))


DRIVERS = {}  # اسم المشغّل -> دالة (dev) تعيد قائمة حركات بحقول user_id و timestamp. أضف مشغّلًا لأي نوع جهاز آخر هنا


LAST_READ = {}  # آخر قراءة لكل جهاز: {"cache": هل من النسخة المحلية؟, "n": عدد السجلات}


def read_device(dev, full=False):
    drv = DRIVERS.get(str(dev.get("driver") or "zk"))
    if drv:
        return drv(dev)
    return read_device_zk(dev, full)


def _cache_rows(name):
    c = _read_json(LOG_CACHE % "".join(ch if ch.isalnum() else "_" for ch in name), None)
    return c if isinstance(c, dict) and isinstance(c.get("rows"), list) else None


def read_device_zk(dev, full=False):
    """الجهاز لا يدعم التصفية بالتاريخ فيُنزَّل كل سجله. لذلك نقرأ عدد السجلات أولًا (سريع)، فإن لم يتغير منذ
    آخر قراءة (وخلال 24 ساعة) نستعمل النسخة المحلية فورًا بدل إعادة التنزيل. المحاولة الأولى أو بعد بصمات جديدة تنزّل كل شيء."""
    with dev_lock(dev["name"]):
        conn = connect(dev)
        try:
            try:
                conn.disable_device()
            except Exception:
                pass
            n = None
            try:
                conn.read_sizes()
                n = int(conn.records)
            except Exception:
                pass
            path = LOG_CACHE % "".join(ch if ch.isalnum() else "_" for ch in dev["name"])
            c = None if full else _cache_rows(dev["name"])
            if c and n is not None and c.get("n") == n and time.time() - float(c.get("at", 0)) < 86400:
                LAST_READ[dev["name"]] = {"cache": True, "n": n}
                return [SimpleNamespace(user_id=r[0], timestamp=datetime.fromisoformat(r[1])) for r in c["rows"]]
            att = conn.get_attendance() or []
            LAST_READ[dev["name"]] = {"cache": False, "n": len(att)}
            if n is not None:
                try:
                    _write_json(path, {"n": n, "at": time.time(),
                                       "rows": [[str(a.user_id), a.timestamp.isoformat()] for a in att if isinstance(a.timestamp, datetime)]})
                except Exception:
                    pass
            return att
        finally:  # لا نمسح سجلات الجهاز أبدًا؛ نعيد تفعيله دائمًا
            for fn in (conn.enable_device, conn.disconnect):
                try:
                    fn()
                except Exception:
                    pass


def row_of(a, dev):
    ts = a.timestamp
    if not isinstance(ts, datetime) or ts.year < CFG["min_year"] or ts > datetime.now() + timedelta(days=1):
        return None  # تاريخ غير منطقي (ساعة الجهاز خاطئة)
    uid = str(a.user_id).strip().lstrip("0") or "0"
    return [uid, ts.strftime("%Y-%m-%d %H:%M"), dev["name"]]


def day_before(last):
    if not last:
        return ""
    return (datetime.strptime(last[:10], "%Y-%m-%d") - timedelta(days=1)).strftime("%Y-%m-%d")


def collect_devices(key, force=False):
    """يقرأ كل جهاز عبر الشبكة المحلية فقط، ويحفظ حركاته الجديدة في صندوق الإرسال. لا يحتاج إنترنت."""
    state = load_state()
    # عند تغيير رابط السكريبت (جدول/نظام جديد) تُصفَّر مؤشرات السحب وكاش الأجهزة تلقائيًا
    tgt = hashlib.sha1(CFG["url"].encode("utf-8")).hexdigest()[:12]
    if state.get("_target") != tgt:
        stale = [k for k in state if k not in ("_meta", "_target")]
        if stale:
            log.warning("تغيّر رابط السكريبت: إعادة سحب كامل سجل الأجهزة للنظام الجديد")
        for k in stale:
            del state[k]
        state["_meta"] = {}
        state["_target"] = tgt
        try:
            os.remove(DEV_CACHE)
        except OSError:
            pass
        save_state(state)
    meta = state.setdefault("_meta", {})
    items, failed = [], False
    devs = get_devices({"k": key})
    if not devs:
        log.warning("لا توجد أجهزة مفعّلة")
    for dev in devs:
        name = dev["name"]
        m = meta.setdefault(name, {"fails": 0, "next": 0})
        if not force and m.get("next", 0) > time.time():
            log.info("%s: تخطٍّ مؤقت بعد إخفاقات متكررة (إعادة المحاولة بعد %d دقيقة)", name, int((m["next"] - time.time()) / 60) + 1)
            continue
        t0 = time.time()
        try:
            since = day_before(state.get(name, ""))  # تداخل يوم واحد للأمان، والخادم يزيل المكرر
            rows, bad, rd = [], 0, 0
            for a in read_device(dev):
                rd += 1
                r = row_of(a, dev)
                if r is None:
                    bad += 1
                elif r[1][:10] >= since:
                    rows.append(r)
            queued = outbox_add(rows)  # نقطة التقدم تُحفظ بعد أن صارت الحركات في الملف المحلي الآمن
            if rows:
                state[name] = max(state.get(name, ""), max(r[1] for r in rows))
            m["fails"], m["next"] = 0, 0
            save_state(state)
            ms = int((time.time() - t0) * 1000)
            log.info("%s: قُرئت %d، حُفظت محليًا %d (بانتظار الإرسال)، تاريخ غير صالح %d (%d ms)", name, rd, queued, bad, ms)
            items.append({"name": name, "ok": True, "n": 0, "dups": 0, "bad": bad, "read": rd, "ms": ms, "last": state.get(name, "")})
        except Exception as e:
            failed = True
            kind = classify(e)
            m["fails"] = int(m.get("fails", 0)) + 1
            m["next"] = time.time() + cooldown(m["fails"]) * 60
            save_state(state)
            log.error("%s: فشل [%s]: %s", name, kind, e)
            items.append({"name": name, "ok": False, "n": 0, "kind": kind, "err": str(e), "ms": int((time.time() - t0) * 1000), "last": state.get(name, "")})
    return items, failed


def flush_outbox(key, items=None, wait=0):
    """يرسل الحركات المحفوظة محليًا للخادم (مجمّعة حسب الجهاز). عند عدم توفر إنترنت تبقى محفوظة. يرجع (تمّ؟, عدد المتبقي)"""
    rows = outbox_load()
    if not rows:
        return True, 0
    if not wait_online(wait):
        log.warning("لا يوجد إنترنت: %d حركة محفوظة محليًا وستُرسل تلقائيًا عند عودته (fp_outbox.json)", len(rows))
        return False, len(rows)
    groups = {}
    for r in rows:
        groups.setdefault(r[2], []).append(r)
    names = list(groups)
    left, ok_all = [], True
    for idx, dev in enumerate(names):
        lst = groups[dev]
        t = {"added": 0, "dups": 0, "resent": 0, "bad": 0}
        sent = 0
        try:
            for i in range(0, len(lst), 2000):
                chunk = lst[i:i + 2000]
                s = post_rows(chunk, key)
                for k in t:
                    t[k] += s[k]
                sent += len(chunk)
        except Exception as e:
            ok_all = False
            log.error("%s: تعذر الإرسال (%s). أُبقيت %d حركة محليًا", dev, e, len(lst) - sent)
            left.extend(lst[sent:])
            for it in (items or []):
                if it["name"] == dev:
                    it["err"] = ((it.get("err") or "") + " تعذر الإرسال: %s" % e).strip()
        else:
            log.info("%s: أُرسلت %d، جديدة %d، موجودة مسبقًا %d، مكررة مريبة %d، مرفوضة %d", dev, len(lst), t["added"], t["resent"], t["dups"], t["bad"])
        for it in (items or []):
            if it["name"] == dev:
                it["n"], it["dups"], it["bad"] = t["added"], t["dups"], it.get("bad", 0) + t["bad"]
        rest = [r for d2 in names[idx + 1:] for r in groups[d2]]
        outbox_save(left + rest)  # حفظ تقدم آمن بعد كل جهاز
    return ok_all, len(left)


def run_sync(force=False, collect=True, flush=True, wait=0):
    key = get_key()
    items, failed = [], False
    if collect:
        items, failed = collect_devices(key, force)
    sent_ok, left = True, len(outbox_load())
    if flush:
        sent_ok, left = flush_outbox(key, items, wait)
    s = write_status(items, not failed)
    s2 = read_status()
    s2["pending"] = left
    _write_json(STATUS, s2)
    if items and online(4):
        report(items, key)
    return 1 if failed else 0


def run_loop(minutes):
    global MODE
    MODE = "loop"
    minutes = max(1, int(minutes or 15))
    log.info("خدمة مستمرة: سحب كل %d دقيقة (Ctrl+C للإيقاف). حالتها في %s", minutes, STATUS)
    while True:
        try:
            run_sync()
        except Exception as e:  # أي خطأ غير متوقع لا يوقف الخدمة
            log.error("خطأ في الدورة: %s", e)
            try:
                write_status([], False, str(e))
                report([], get_key(), {"v": VERSION, "host": socket.gethostname(), "mode": MODE, "err": str(e), "okts": read_status().get("last_success", ""), "fails": read_status().get("fails", 0)})
            except Exception:
                pass
        time.sleep(minutes * 60)


def pid_alive(pid):
    try:
        pid = int(pid)
        if os.name == "nt":
            out = subprocess.run(["tasklist", "/FI", "PID eq %d" % pid], capture_output=True, text=True).stdout
            return str(pid) in out
        os.kill(pid, 0)
        return True
    except Exception:
        return False


def run_ensure(minutes):
    """حارس: إن لم تُحدَّث الحالة منذ 3 دورات ولم تكن العملية حيّة يعيد تشغيل الخدمة"""
    s = read_status()
    try:
        age = time.time() - time.mktime(time.strptime(s.get("last_run", ""), "%Y-%m-%d %H:%M:%S"))
    except Exception:
        age = 1e9
    if age < minutes * 60 * 3 or pid_alive(s.get("pid")):
        return 0
    py = sys.executable
    args = [py, os.path.abspath(__file__), "--loop", str(minutes)]
    kw = {"creationflags": 0x00000008 | 0x00000200} if os.name == "nt" else {"start_new_session": True}
    subprocess.Popen(args, cwd=HERE, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, **kw)
    log.warning("الخدمة متوقفة (آخر تحديث قبل %d دقيقة): أُعيد تشغيلها", age // 60)
    return 0


def install_task(minutes):
    if os.name != "nt":
        print("التثبيت التلقائي لويندوز فقط. على لينكس/ماك استخدم systemd أو cron مع: python fp_bridge.py --loop %d" % minutes)
        return 1
    py = sys.executable
    pw = py.replace("python.exe", "pythonw.exe")
    py = pw if os.path.exists(pw) else py
    me = os.path.abspath(__file__)
    cmds = [["schtasks", "/Create", "/SC", "ONLOGON", "/TN", "FPBridge", "/TR", '"%s" "%s" --loop %d' % (py, me, minutes), "/RL", "LIMITED", "/F"],
            ["schtasks", "/Create", "/SC", "MINUTE", "/MO", "30", "/TN", "FPBridgeWatchdog", "/TR", '"%s" "%s" --ensure %d' % (py, me, minutes), "/RL", "LIMITED", "/F"]]
    rc = 0
    for c in cmds:
        r = subprocess.run(c, capture_output=True, text=True)
        print((r.stdout or r.stderr).strip())
        rc |= r.returncode
    if rc == 0:
        print("تم. الخدمة تبدأ عند دخول ويندوز، والحارس يعيد تشغيلها إن توقفت. للتشغيل الآن: python fp_bridge.py --loop %d" % minutes)
    return rc


def remove_task():
    rc = 0
    for n in ("FPBridge", "FPBridgeWatchdog"):
        r = subprocess.run(["schtasks", "/Delete", "/TN", n, "/F"], capture_output=True, text=True)
        print((r.stdout or r.stderr).strip())
        rc |= r.returncode
    return rc


def show_status():
    s = read_status()
    if not s:
        print("لا توجد حالة بعد (لم يعمل الوسيط على هذا الكمبيوتر).")
        return 1
    print("الإصدار %s | الوضع %s | الجهاز %s | PID %s (%s)" % (s.get("version"), s.get("mode"), s.get("host"), s.get("pid"), "حيّة" if pid_alive(s.get("pid")) else "غير نشطة"))
    print("آخر تشغيل: %s | آخر نجاح: %s | إخفاقات متتالية: %s" % (s.get("last_run"), s.get("last_success", "—"), s.get("fails", 0)))
    print("حركات محفوظة محليًا بانتظار الإرسال (fp_outbox.json): %d" % len(outbox_load()))
    if s.get("last_error"):
        print("آخر خطأ:", s["last_error"])
    for i in s.get("items", []):
        print(" -", i["name"], "نجاح" if i.get("ok") else "فشل [%s] %s" % (i.get("kind"), i.get("err")), "| مقروء", i.get("read", 0), "جديد", i.get("n", 0), "مكرر", i.get("dups", 0), "رفض", i.get("bad", 0), "|", i.get("ms", 0), "ms")
    return 0


# ====================== الطريقة 3: خادم محلي لزر «سحب من الجهاز» ======================
TOK = {}  # توكن مقبول -> وقت انتهاء التخزين المؤقت (60 ث)


def token_ok(t):
    t = str(t or "")
    if not t:
        return False
    now = time.time()
    if TOK.get(t, 0) > now:
        return True
    for k in [k for k, v in TOK.items() if v <= now]:
        TOK.pop(k, None)
    try:
        r = call("check", retries=1, t=t)
    except Exception:
        return False
    if r.get("role") in ("admin", "hr", "fp"):
        TOK[t] = now + 60
        return True
    return False


class Handler(BaseHTTPRequestHandler):
    def _cors(self):
        allowed = CFG.get("allowed_origins") or []
        org = self.headers.get("Origin", "")
        self.send_header("Access-Control-Allow-Origin", "*" if not allowed else (org if org in allowed else "null"))
        self.send_header("Vary", "Origin")
        self.send_header("Access-Control-Allow-Methods", "GET, POST, OPTIONS")
        self.send_header("Access-Control-Allow-Headers", "Content-Type")
        self.send_header("Access-Control-Allow-Private-Network", "true")

    def _send(self, code, obj):
        b = json.dumps(obj, ensure_ascii=False).encode("utf-8")
        self.send_response(code)
        self.send_header("Content-Type", "application/json; charset=utf-8")
        self.send_header("Content-Length", str(len(b)))
        self._cors()
        self.end_headers()
        self.wfile.write(b)

    def do_OPTIONS(self):
        self.send_response(204)
        self.send_header("Access-Control-Max-Age", "600")
        self._cors()
        self.end_headers()

    def do_GET(self):
        self._send(200, {"ok": True, "v": VERSION, "msg": "fp bridge ready", "devices": [d["name"] for d in CFG["devices"]]})

    def do_POST(self):
        try:
            d = json.loads(self.rfile.read(int(self.headers.get("Content-Length", 0))) or b"{}")
        except Exception:
            return self._send(400, {"ok": False, "err": "bad request"})
        if not token_ok(d.get("t")):
            return self._send(403, {"ok": False, "err": "unauthorized"})
        frm, to = str(d.get("from") or ""), str(d.get("to") or "")  # YYYY-MM-DD
        dates = {str(x)[:10] for x in (d.get("dates") or []) if x}
        full = bool(d.get("full"))

        def keep(day):
            if dates:
                return day in dates
            return (not frm or day >= frm) and (not to or day <= to)

        def one(dev):
            t0 = time.time()
            out = []
            try:
                for a in read_device(dev, full):
                    r = row_of(a, dev)
                    if r and keep(r[1][:10]):
                        out.append(r)
                lr = LAST_READ.get(dev["name"], {})
                return dev["name"], out, None, {"name": dev["name"], "ms": int((time.time() - t0) * 1000), "n": len(out), "read": lr.get("n"), "cache": bool(lr.get("cache"))}
            except Exception as e:
                return dev["name"], out, "%s: %s" % (dev["name"], e), {"name": dev["name"], "ms": int((time.time() - t0) * 1000), "n": 0, "err": str(e)}

        devs = get_devices({"t": d["t"]})
        rows, errs, info = [], [], []
        if devs:
            with ThreadPoolExecutor(max_workers=len(devs)) as ex:  # الأجهزة بالتوازي: الزمن = أبطأ جهاز لا مجموعها
                for name, r, er, inf in ex.map(one, devs):
                    rows += r
                    info.append(inf)
                    if er:
                        errs.append(er)
        rows.sort(key=lambda r: (r[1], r[2]))
        log.info("سحب من الأجهزة بطلب من الصفحة: %d حركة %s %s", len(rows), errs or "", [(i["name"], i["ms"]) for i in info])
        self._send(200, {"ok": bool(rows) or not errs, "rows": rows, "errors": errs, "info": info})

    def log_message(self, *a):
        pass


def run_serve():
    port = int(CFG["port"])
    try:
        srv = ThreadingHTTPServer(("127.0.0.1", port), Handler)
    except OSError as e:
        log.error("تعذر تشغيل الخادم على المنفذ %d (%s). غيّر port في fp_config.json", port, e)
        return 1
    log.info("الوسيط يعمل على http://127.0.0.1:%d (اتركه مفتوحًا، Ctrl+C للإيقاف)", port)
    try:
        srv.serve_forever()
    except KeyboardInterrupt:
        pass
    return 0


# ====================== فحص شامل ======================
def run_test():
    ok = True

    def line(good, msg):
        print(("[ نجح ] " if good else "[ فشل ] ") + msg)

    key = None
    try:
        key = get_key()
        line(True, "ملف المفتاح موجود")
    except Exception as e:
        line(False, str(e))
        ok = False
    server_ok = True
    try:
        call("info", retries=1)
        line(True, "الخادم (Apps Script) يردّ")
    except Exception as e:
        server_ok = False
        line(False, "الخادم لا يردّ: %s. إن كان الكيبل موصولًا فالإنترنت مقطوع عادةً؛ سأكمل فحص الأجهزة محليًا" % e)
    pend = len(outbox_load())
    print("          حركات محفوظة محليًا بانتظار الإرسال: %d" % pend)
    if key and server_ok:
        try:
            call("devices", retries=1, k=key)
            line(True, "مفتاح الجسر صحيح")
        except Exception as e:
            line(False, "مفتاح الجسر مرفوض (%s). انسخه من showKey وضعه في fp_key.txt" % e)
            ok = False
    devs = get_devices({"k": key}) if (key and server_ok) else (_read_json(DEV_CACHE, []) or [dict(d) for d in CFG["devices"]])
    devs = [dict(d, name=str(d.get("name")), ip=str(d.get("ip")), port=int(d.get("port") or 4370), password=int(CFG["comm_keys"].get(str(d.get("name")), 0) or 0)) for d in devs]
    if not devs:
        line(False, "لا توجد أجهزة مفعّلة: فعّل جهازًا بطريقة «وسيط بايثون» من تبويب الأجهزة")
        ok = False
    for dev in devs:
        tag = "%s (%s:%s)" % (dev["name"], dev["ip"], dev["port"])
        try:
            conn = connect(dev)
        except Exception as e:
            line(False, "%s: %s" % (tag, e))
            ok = False
            continue
        try:
            def safe(fn):
                try:
                    return fn()
                except Exception:
                    return "?"
            n = len(conn.get_attendance() or [])
            clock = safe(conn.get_time)
            line(True, "%s: اتصال ناجح | الطراز %s | الإصدار %s | الرقم التسلسلي %s | حركات مخزنة %d" % (
                tag, safe(conn.get_device_name), safe(conn.get_firmware_version), safe(conn.get_serialnumber), n))
            if isinstance(clock, datetime):
                drift = abs((datetime.now() - clock).total_seconds()) / 60
                line(drift < 5, "ساعة الجهاز %s (فرق %.0f دقيقة عن هذا الكمبيوتر)%s" % (
                    clock.strftime("%Y-%m-%d %H:%M"), drift, "" if drift < 5 else "، اضبط الساعة من قائمة الجهاز" ))
                ok = ok and drift < 5
        finally:
            try:
                conn.disconnect()
            except Exception:
                pass
    print("\nالنتيجة: " + ("كل شيء جاهز ✓" if ok else "هناك ما يحتاج معالجة (انظر السطور الفاشلة)"))
    return 0 if ok else 1


def main():
    ap = argparse.ArgumentParser(description="fp_bridge v" + VERSION)
    g = ap.add_mutually_exclusive_group()
    g.add_argument("--test", action="store_true", help="فحص الاتصال والإعدادات")
    g.add_argument("--serve", action="store_true", help="خادم محلي لزر السحب من الصفحة")
    g.add_argument("--loop", nargs="?", const=15, type=int, metavar="MIN", help="خدمة مستمرة: سحب كل MIN دقيقة")
    g.add_argument("--ensure", nargs="?", const=15, type=int, metavar="MIN", help="حارس يعيد تشغيل الخدمة إن توقفت")
    g.add_argument("--install-task", dest="inst", nargs="?", const=15, type=int, metavar="MIN", help="تثبيت المهام على ويندوز")
    g.add_argument("--remove-task", dest="rmtask", action="store_true", help="إزالة المهام")
    g.add_argument("--status", action="store_true", help="عرض حالة الوسيط")
    g.add_argument("--collect", action="store_true", help="قراءة الأجهزة وحفظها محليًا فقط (بلا إنترنت)")
    g.add_argument("--flush", action="store_true", help="إرسال الحركات المحفوظة محليًا للخادم")
    g.add_argument("--sync", action="store_true", help="قراءة الأجهزة ثم الإرسال (الافتراضي)")
    ap.add_argument("--wait", type=int, default=0, metavar="MIN", help="انتظار عودة الإنترنت حتى MIN دقيقة قبل الإرسال")
    a = ap.parse_args()
    if a.test:
        return run_test()
    if a.status:
        return show_status()
    setup_log()
    global MODE
    MODE = "loop" if a.loop is not None else "serve" if a.serve else "sync"
    try:
        if a.inst is not None:
            return install_task(a.inst)
        if a.rmtask:
            return remove_task()
        if a.ensure is not None:
            return run_ensure(a.ensure)
        if a.loop is not None:
            return run_loop(a.loop)
        if a.serve:
            return run_serve()
        if a.collect:
            return run_sync(collect=True, flush=False)
        if a.flush:
            return run_sync(collect=False, flush=True, wait=a.wait)
        return run_sync(wait=a.wait)
    except Exception as e:
        log.error("خطأ: %s", e)
        return 1


if __name__ == "__main__":
    sys.exit(main())

async function call(action,data,auth,again){
  const body=Object.assign({action},data||{});
  if(auth){if(!TOKEN){const e=new Error(ERRS.unauthorized);e.j={ok:false,err:'unauthorized'};throw e}body.t=TOKEN}
  let r,j;
  try{r=await fetch(urlOf(),{method:'POST',body:JSON.stringify(body)})}catch(e){throw new Error('تعذر الاتصال بالخادم، تحقق من الإنترنت')}
  try{j=await r.json()}catch(e){throw new Error('ردّ غير صالح من الخادم. تأكد من رابط السكربت وأن الوصول «أي شخص»')}
  if(!j.ok){
    if(j.err==='unauthorized'&&auth&&!again&&CRED&&await silentLogin())return call(action,data,auth,true);
    if(j.err==='unauthorized'&&auth)expired();
    if(j.err==='unauthorized'&&!auth){const e=new Error(STALE);e.j=j;throw e}
    const e=new Error(ERRS[j.err]||j.err||'فشل');e.j=j;throw e;
  }
  return j;
}

const DIRC={'دخول':'in','خروج':'out','كلاهما':'both'};

function fpIdx(){ /* (جهاز|رقم) ← صف الربط. أما أرقام الموظف العامة (الأولى/الثانية) فتبقى احتياطًا لكل الأجهزة */

  DB.employees.forEach(e=>[e.fpId,e.fpId2,e.fpId3].map(nid).filter(Boolean).forEach(k=>{if(!leg.has(k))leg.set(k,e.empNo)}));
  DB.devices.forEach(d=>dv.set(d.name,DIRC[d.dir]||'both'));

function ownerOf(dev,fp){ /* رقم الموظف صاحب (جهاز، رقم بصمة): الربط الدقيق بالجهاز أولًا ثم الأرقام العامة */
  const x=fpIdx(),r=x.m.get(String(dev||'')+'|'+nid(fp));
  if(r)return r.empNo;

const ownerP=p=>ownerOf(p.dev,p.fpId);
const inWin=(t,a,b)=>!a||!b||(a<=b?(t>=a&&t<=b):(t>=a||t<=b));
const isOvn=W=>toMin(W.end)<=toMin(W.start);                                   /* دوام مبيت: ينتهي بعد منتصف الليل */
const ovnCut=W=>toMin(W.end)+Math.floor((toMin(W.start)-toMin(W.end))/2);        /* بصمة قبل هذا الوقت صباحًا تُنسب لدوام اليوم السابق */

function buildPX(list){ /* يوزّع الحركات على (موظف|يوم) بغضّ النظر عن الجهاز الذي صدرت منه */
  const M=new Map(),ov=ovnSet(),x=fpIdx();
  list.forEach(p=>{
    const emp=ownerP(p);if(!emp)return;
    let d=p.ts.slice(0,10);const t=p.ts.slice(11,16);let mn=toMin(t);
    const mr=x.m.get(String(p.dev||'')+'|'+nid(p.fpId));
    if(ov.has(emp)){const W=schedOf(emp,d);if(isOvn(W)&&mn<ovnCut(W)){d=addDays(d,-1);mn+=1440}}
    const dir=(mr&&DIRC[mr.dir])||x.dv.get(p.dev)||'both';
    const rec={t,mn,dev:p.dev||'',fp:nid(p.fpId),ts:p.ts,via:p.via||'',rcv:p.rcv||'',dir,w:(mr&&mr.from&&mr.to&&!inWin(t,mr.from,mr.to))?'خارج وقت الجهاز ('+mr.from+'–'+mr.to+')':'',src:p,emp,d};
    const k=emp+'|'+d;(M.get(k)||M.set(k,[]).get(k)).push(rec);

function dayPun(e,d,M){
  M=M||getPX();
  const arr=M.get(e.empNo+'|'+d)||[],g=Number(DB.work.dedupe==null?5:DB.work.dedupe),use=[],skip=[],dups=[];
  arr.forEach(p=>{
    if(p.w){skip.push(p);return}
    const L=use[use.length-1];
    if(L&&p.mn-L.mn<=g){if(p.mn!==L.mn)dups.push({p,of:L});return}   /* نفس الدقيقة تمامًا = نفس الحركة من مصدرين: تُهمل دون ضجيج */
    use.push(p);

  const after=outs.filter(p=>!i||p.mn>i.mn),o=after.length?after[after.length-1]:null,odd=i?outs.filter(p=>p.mn<i.mn&&p.dir==='out'):[];

  if(!ps.length){r.st='غياب';r.cls='bad';return r}

}

async function syncPush(force){

  if(syncing){SY.again=true;return false}

    const p=Object.assign({},DB,{logs:DB.logs.slice(-500)});delete p.punches;delete p.stats;p.fpmap=(DB.fpmap||[]).filter(r=>r.dev&&nid(r.fpId));

    SY.rev=j.rev;SY.dirty=false;ok=true;den=j.denied&&j.denied.length?j.denied:null;syncStat('تم الحفظ ✓ '+nowStr().slice(11,16));
  }catch(e){
    if(e.j&&e.j.conflict){
      syncStat('تعارض مع نسخة أحدث','bad');
      redo=confirm('عُدّلت البيانات من جهاز آخر أثناء عملك.\n\nموافق: حفظ تعديلاتك فوق نسخة الخادم (يستبدل تعديلات الآخرين).\nإلغاء: تحميل نسخة الخادم وإلغاء تعديلاتك غير المحفوظة.')?'force':'pull';
    }else if(TOKEN){syncStat('فشل الحفظ — ستُعاد المحاولة','bad');logErr('sync: '+e.message,1)}
  }finally{syncing=false}
  if(den){alert('رفض الخادم بعض التعديلات لأن صلاحيتك لا تسمح بها:\n'+den.slice(0,6).join('\n')+'\n\nسيتم تحديث البيانات من الخادم.');await syncPull(true);render();return true}
  if(redo==='force')return syncPush(true);

}
async function syncPull(silent){

  if(!silent&&!confirm('سيتم استبدال بيانات هذه الصفحة (بما فيها أي تعديلات غير محفوظة) بنسخة الخادم. متابعة؟'))return;
  if(syncing)return;syncing=true;let m=null;
  try{
    const j=await api('pull');
    DB=applyDb(j.db,DB.punches);SY.rev=j.rev;SY.dirty=false;SY.again=false;
    await pullPunches();applyTheme();
    syncStat(S&&S.role!=='emp'?'تم التحديث ✓ '+nowStr().slice(11,16):'');m=['تم التحديث من الخادم',0];
  }catch(e){if(TOKEN){syncStat('فشل التحديث','bad');m=['فشل: '+e.message,1]}}
  finally{syncing=false}
  if(!silent){render();if(m)msg(m[0],m[1])}
}
let LASTPUSH={added:0,dups:0,resent:0,bad:0};
async function pushPunches(list,method){
  let n=0;LASTPUSH={added:0,dups:0,resent:0,bad:0};
  for(let i=0;i<list.length;i+=3000){const j=await api('punches',{method:method||'',rows:list.slice(i,i+3000).map(p=>[p.fpId,p.ts,p.dev||''])});n+=j.added||0;LASTPUSH.dups+=j.dups||0;LASTPUSH.resent+=j.resent||0;LASTPUSH.bad+=j.skipped||0}
  LASTPUSH.added=n;return n;
}
async function pullPunches(){
  const j=await api('since',{from:SY.pc||0,ep:SY.ep||''});
  const rows=j.rows.map(r=>({fpId:nid(r[0]),ts:String(r[1]),dev:String(r[2]||''),via:String(r[3]||''),rcv:String(r[4]||'')}));
  if(j.full)DB.punches=rows;
  else{const have=new Set(DB.punches.map(pendKey));rows.forEach(p=>{const k=pendKey(p);if(!have.has(k)){have.add(k);DB.punches.push(p)}})}
  SY.pc=j.total;SY.ep=j.ep;PX=null;return rows.length;
}
/* مزامنة دورية: إعادة محاولة الحفظ، أو سحب أي تغيير جاء من جهاز آخر */

async function replaceAll(old){
  const srv=DB.users,pk=Array.isArray(old.punches)?old.punches:[];
  const nd=applyDb(old,DB.punches),ids=new Set(srv.map(u=>u.id));
  nd.users=(old.users||[]).filter(u=>!ids.has(u.id)).concat(srv);
  DB=nd;PX=null;
  if(!await syncPush(true))throw new Error('تعذر الحفظ على الخادم');
  if(pk.length){await pushPunches(pk.map(p=>({fpId:nid(p.fpId),ts:String(p.ts),dev:p.dev||''})),'استعادة نسخة');await pullPunches()}
}
function restoreFile(f){

    let old;try{const o=JSON.parse(r.result);old=o.db||o;if(!Array.isArray(old.users)||!Array.isArray(old.employees))throw 0}catch(e){return msg('ملف غير صالح',1)}

    msg('جارٍ الاسترجاع…');
    try{await replaceAll(old);log('استرجاع نسخة احتياطية');render();msg('تم الاسترجاع وحُفظ على الخادم')}catch(e){msg('فشل الاسترجاع: '+e.message,1)}
  };
  r.readAsText(f);
}

function mvOf(o,d){ /* فروق تستوجب توثيقًا في سجل الانتقالات */
  const r=[];[['dept','نقل قسم'],['title','تغيير عنوان وظيفي'],['fpId','تغيير رقم البصمة'],['fpId2','تغيير رقم البصمة الثانية'],['fpId3','تغيير رقم البصمة الثالثة']].forEach(([k,kind])=>{if(String(o[k]||'')!==String(d[k]||''))r.push({kind,from:String(o[k]||''),to:String(d[k]||'')})});

function delEmp(n){

async function genEmpAccts(all){

function normDate(x){
  if(x instanceof Date){const t=new Date(x.getTime()+12*3600e3);return t.getUTCFullYear()+'-'+String(t.getUTCMonth()+1).padStart(2,'0')+'-'+String(t.getUTCDate()).padStart(2,'0')}
  const s=String(x==null?'':x).trim();let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return '';
}

function decideLeave(id,ok){
  const l=DB.leaves.find(x=>x.id===id);if(!l||l.status!=='معلق')return;const e=empBy(l.empNo),t=ltOf(l),n=lvDays(l);if(!e)return msg('الموظف غير موجود',1);
  if(ok){
    if(l.stage==='مراجعة')return msg('هذا النوع يتطلب مرحلة مراجعة قبل الاعتماد',1);

    if(t.deduct&&e.balance<n)return msg('رصيد الموظف لا يكفي ('+e.balance+' < '+n+')',1);
    const ov=DB.cases.find(c=>c.empNo===l.empNo&&c.from<=l.to&&c.to>=l.from);
    if(ov&&!confirm(`تتداخل الفترة مع حالة «${ov.type}» (${ov.from} إلى ${ov.to}) للموظف نفسه. متابعة؟`))return;
    if(t.deduct){e.balance-=n;addLedger(l.empNo,'استهلاك إجازة',-n,l.id,t.name+' '+l.from+' → '+l.to)}
    DB.cases.push({id:Date.now(),empNo:l.empNo,type:t.ctype,from:l.from,to:l.to,note:'طلب إجازة موافق عليه',ref:'إجازة #'+l.id,by:S.id});

function cancelLeave(id){

  const why=(prompt('سبب الإلغاء (إلزامي):')||'').trim();if(!why)return;
  if(l.status==='موافق'){
    DB.cases=DB.cases.filter(c=>!(c.ref==='إجازة #'+l.id||(!c.ref&&c.empNo===l.empNo&&c.from===l.from&&c.to===l.to&&c.type===t.ctype)));

function hrsInfo(e){const tot=hrsOf(e.empNo),cv=hrsConv(e.empNo),un=Math.max(0,r2(tot-cv*HRS_DAY)),k=Math.floor(un/HRS_DAY+1e-9);return {tot,cv,un,k,rem:r2(un-k*HRS_DAY)}}

let pending=[],pendRaw=[],idCol=0,pendMethod='';   // idCol: 0 = تلقائي، وإلا ترتيب العمود (يبدأ من 1)
const BR_URL='http://127.0.0.1:8765/';
const P_D1=/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/,P_D2=/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/,P_T=/(\d{1,2}):(\d{2})(?::\d{2})?/g;
const P_ID=/^\d{1,10}$/,pad2=n=>String(n).padStart(2,'0');
const ID_HDR=['enno','en no','en-no','userid','user id','user_id','badgenumber','badge','pin','emp id','empid','employee id','user','id','رقم البصمة','رقم المستخدم','رقم الموظف','المعرف','معرف'];
function cellStr(x){
  if(x instanceof Date){   // خلية Excel: وقت فقط (سنة 1899) أو تاريخ فقط (منتصف الليل) أو الاثنان
    const d=x.getFullYear()+'-'+pad2(x.getMonth()+1)+'-'+pad2(x.getDate()),tm=pad2(x.getHours())+':'+pad2(x.getMinutes());
    return x.getFullYear()<1950?tm:(x.getHours()===0&&x.getMinutes()===0)?d:d+' '+tm;
  }
  return String(x==null?'':x).trim();
}
// قارئ ذكي: يتعرف على صف العناوين، يتجاهل عمود التسلسل، ويقبل تحديد عمود الرقم يدويًا (col)
function parseRows(raw,col){
  const rows=raw.map(r=>r.map(cellStr).filter(x=>x!==''));
  let hi=-1;
  for(let i=0;i<Math.min(rows.length,6)&&hi<0;i++){
    const line=rows[i].join(' ');
    if(P_D1.test(line)||P_D2.test(line))continue;
    const low=rows[i].map(c=>c.toLowerCase().replace(/\s+/g,' '));
    for(const k of ID_HDR){const j=low.indexOf(k);if(j>=0){hi=j;break}}
  }
  const data=[];
  rows.forEach(cells=>{
    const line=cells.join(' ');
    let dm=line.match(P_D1),date;
    if(dm)date=dm[1]+'-'+pad2(dm[2])+'-'+pad2(dm[3]);
    else{dm=line.match(P_D2);if(!dm)return;date=dm[3]+'-'+pad2(dm[2])+'-'+pad2(dm[1])}
    const tms=[...line.replace(dm[0],' ').matchAll(P_T)];
    if(tms.length)data.push({cells,date,tms});
  });
  const ser=new Set();   // أعمدة التسلسل (1،2،3...) ليست رقم بصمة
  if(hi<0&&!col){
    const w=data.slice(0,12),mx=Math.max(0,...w.map(d=>d.cells.length));
    for(let j=0;j<mx;j++){
      const v=w.map(d=>P_ID.test(d.cells[j]||'')?Number(d.cells[j]):NaN);
      if(v.length>=3&&v.every(x=>!isNaN(x))&&v.every((x,i)=>i===0||x===v[i-1]+1))ser.add(j);
    }
  }
  const out=[],seen=new Set();
  data.forEach(d=>{
    let id;
    if(col)id=d.cells[col-1];
    else if(hi>=0)id=d.cells[hi];
    else id=d.cells.find((x,j)=>!ser.has(j)&&P_ID.test(x));
    if(!id||!P_ID.test(id))return;
    id=String(Number(id));
    d.tms.forEach(t=>{
      if(+t[1]>23||+t[2]>59)return;
      const ts=d.date+' '+pad2(t[1])+':'+t[2],k=id+'|'+ts;
      if(!seen.has(k)){seen.add(k);out.push({fpId:id,ts,dev:''})}
    });
  });

}

  });
  const ds=pending.map(p=>p.ts.slice(0,10)).sort(),lo=addDays(st.from||ds[0]||today(),-1),hi=addDays(st.to||ds[ds.length-1]||today(),1);

function dhSig(){return [DB.punches.length,DB.employees.length,DB.cases.length,DB.corrections.length,DB.corrections.filter(c=>c.status==='معتمدة').length,DB.employees.map(e=>(e.svc||'')+(e.start||'')+(e.end||'')).join(''),DB.leaves.length,DB.leaves.filter(l=>l.status==='معلق').length,DB.holidays.length,DB.errors.length,DB.errors.filter(e=>e.fixed).length,DB.devices.length,DB.users.length,JSON.stringify(DB.work),JSON.stringify((DB.stats&&DB.stats.bridge)||{}),JSON.stringify((DB.stats&&DB.stats.backup)||{}),today(),nowStr().slice(11,15)].join('|')}
function dhMemo(k,f){const s=dhSig();if(DHC.sig!==s)DHC={sig:s,m:{}};return k in DHC.m?DHC.m[k]:(DHC.m[k]=f())}

/* تصنيف موظف في يوم معيّن، مع مراعاة أن اليوم الحالي لم ينتهِ بعد */
function dhCls(e,d){
  const r=dayInfo(e,d),st=r.st,o={r,k:'',late:false,early:false,why:''},W=DB.work;
  if(d>today()){o.k='fut';return o}
  if(!isWork(d)||st==='خارج الخدمة'){o.k='off';o.why=st;return o}
  const isT=d===today(),n=dhMin();
  const cs=caseOf(e.empNo,d);
  if(cs&&cs.type==='غياب'){o.k='absent';o.rec=true;o.why='غياب مسجّل رسميًا'+(cs.note?': '+cs.note:'');return o}
  if(cs){o.k='case';o.why=cs.note||'حالة مسجلة من مسؤول البصمة';return o}
  if(st==='غياب'){
    if(isT&&n<=dhSt()){o.k='pend';o.why='الدوام لم يبدأ أو ضمن مهلة التأخير';return o}
    o.k='absent';o.why=fpsOf(e).length?'لا توجد بصمة ولا حالة مسجلة في هذا اليوم':'الموظف غير مرتبط برقم بصمة';return o}
  if(st==='بصمة ناقصة'){
    if(isT&&n<toMin(W.end)){o.k='in';o.why='بصمة دخول فقط (ما زال ضمن الدوام)';o.late=toMin(r.in)>dhSt();return o}
    o.k='inc';o.why='بصمة واحدة فقط ('+r.in+') بلا بصمة خروج';return o}
  o.k='att';o.late=st.includes('تأخير');o.early=st.includes('خروج مبكر')&&!(isT&&n<toMin(W.end));
  if(o.late)o.why='دخل '+r.in+' (بعد '+W.start+' + مهلة '+(W.grace||0)+' د)';
  if(o.early)o.why+=(o.why?' | ':'')+'خرج '+r.out+' قبل '+W.end;
  return o}
function dhDay(d){return dhMemo('d'+d,()=>{
  const o={d,off:false,why:'',tot:DB.employees.length,c:{att:0,in:0,late:0,early:0,absent:0,case:0,inc:0,pend:0},L:{att:[],in:[],late:[],early:[],absent:[],case:[],inc:[],pend:[]}};
  if(!isWork(d)){const h=holidayOf(d);o.off=true;o.why=h?('عطلة '+h.type+(h.name?' - '+h.name:'')):'عطلة أسبوعية';return o}
  DB.employees.forEach(e=>{const x=dhCls(e,d),it={e,x},c=o.c,L=o.L;
    if(x.k==='att'||x.k==='in'){c.att++;L.att.push(it);if(x.k==='in'){c.in++;L.in.push(it)}if(x.late){c.late++;L.late.push(it)}if(x.early){c.early++;L.early.push(it)}}
    else if(c[x.k]!==undefined){c[x.k]++;L[x.k].push(it)}});
  return o})}
/* اليوم المرجعي: اليوم إن كان دوامًا، وإلا آخر يوم دوام؛ والمقارنة مع يوم الدوام الذي قبله (لا مع عطلة) */
function dhDays(){return dhMemo('days',()=>{const t=today();let cur=t,prv=null;
  if(!isWork(t)){cur=null;for(let i=1;i<=14;i++){const x=addDays(t,-i);if(isWork(x)){cur=x;break}}}
  if(cur)for(let i=1;i<=14;i++){const x=addDays(cur,-i);if(isWork(x)){prv=x;break}}
  return{cur,prv,todayOff:!isWork(t)}})}
function dhPeriod(a,b){return dhMemo('p'+a+'_'+b,()=>{
  const s={a,b,wd:0,att:0,late:0,absent:0,inc:0,case:0,punches:0,lv:0,lvDone:0,err:0,fix:0,n:DB.employees.length};
  range(a,b).forEach(d=>{if(d>today()||!isWork(d))return;const c=dhDay(d).c;s.wd++;s.att+=c.att;s.late+=c.late;s.absent+=c.absent;s.inc+=c.inc;s.case+=c.case});
  const inR=t=>!!t&&t.slice(0,10)>=a&&t.slice(0,10)<=b;
  DB.punches.forEach(p=>{if(inR(p.ts))s.punches++});
  DB.leaves.forEach(l=>{if(inR(l.ts))s.lv++;if(inR(l.dts))s.lvDone++});
  DB.errors.forEach(e=>{if(inR(e.ts))s.err++;if(inR(e.fixed))s.fix++});
  s.lateRate=s.att?Math.round(s.late/s.att*1000)/10:0;
  s.absRate=(s.n&&s.wd)?Math.round(s.absent/(s.n*s.wd)*1000)/10:0;
  return s})}
/* الشهر الحالي حتى اليوم مقابل الشهر السابق لنفس عدد الأيام (حتى لا يُقارن شهر كامل بأيام قليلة) */
function dhPeriods(){const t=today(),ms=t.slice(0,7)+'-01',pm=addDays(ms,-1).slice(0,7),mr=monthRange(pm),n=Number(t.slice(8));let pb=addDays(mr[0],n-1);if(pb>mr[1])pb=mr[1];return{cur:dhPeriod(ms,t),prv:dhPeriod(mr[0],pb)}}
function dhCmp(cur,prv,lower,fmt){
  fmt=fmt||(x=>x);const df=Math.round((cur-prv)*10)/10;
  if(df===0)return '<span class="tag">= بلا تغيّر</span>';
  const up=df>0,good=lower==null?null:(lower?!up:up),pc=(fmt.pts||!prv)?'':' ('+Math.round(Math.abs(df)/prv*100)+'%)';
  return `<span class="tag ${good==null?'':good?'ok':'bad'}">${up?'▲ ارتفاع':'▼ انخفاض'} ${fmt(Math.abs(df))}${pc}${good==null?'':good?' — إيجابي':' — يحتاج انتباه'}</span>`}
const dhPts=Object.assign(x=>x+' نقطة',{pts:1});

/* إحصاءات الحركات الخام (مرور واحد على البصمات) */
function dhPun(){return dhMemo('pun',()=>{
  const t=today(),a7=addDays(t,-7),gap=Number(DB.work.dedupe==null?5:DB.work.dedupe);
  const o={devMax:{},todayN:0,todayBy:{},unm:{},unmN:0,raw7:0,ded7:0,dup7:0},g={};
  DB.punches.forEach(p=>{const d=p.ts.slice(0,10),f=nid(p.fpId);
    if(p.dev&&(!o.devMax[p.dev]||p.ts>o.devMax[p.dev]))o.devMax[p.dev]=p.ts;
    if(d===t){o.todayN++;const k=p.dev||'—';o.todayBy[k]=(o.todayBy[k]||0)+1}
    const ow=ownerP(p);if(!ow){const f2=(p.dev?p.dev+':':'')+f,u=o.unm[f2]||(o.unm[f2]={n:0,last:''});u.n++;o.unmN++;if(p.ts>u.last)u.last=p.ts}
    else if(d>=a7){const k=ow+'|'+d;(g[k]||(g[k]=[])).push(toMin(p.ts.slice(11,16)))}});
  Object.keys(g).forEach(k=>{const a=g[k].sort((x,y)=>x-y);o.raw7+=a.length;let last=-1e9,c=0;a.forEach(m=>{if(m-last>gap){c++;last=m}});o.ded7+=c});
  o.dup7=o.raw7-o.ded7;return o})}
/* حالة الأجهزة المفعّلة */
function dhDevs(){return dhMemo('dev',()=>{
  const b=(DB.stats&&DB.stats.bridge)||{},now=Date.now(),pun=dhPun();
  const age=ts=>{const x=Date.parse(String(ts||'').replace(' ','T'));return isNaN(x)?null:(now-x)/36e5};
  return DB.devices.filter(d=>d.on).map(d=>{
    const py=d.method==='وسيط بايثون',s=b[d.name],h=s?age(s.ts):null;let k='na',tx='رفع يدوي (لا مراقبة آلية)';
    if(py){if(!s){k='none';tx='لم يرسل بيانات'}else if(!s.ok){k='fail';tx='فشل السحب'}else if(h!==null&&h>(Number(d.silent)||24)){k='old';tx='متوقف منذ أكثر من '+(Number(d.silent)||24)+' ساعة'}else if(h!==null&&h>3){k='late';tx='متأخر'}else{k='ok';tx='سليم'}}
    const sv=pun.devMax[d.name]||'',mism=!!(s&&/^\d{4}-\d\d-\d\d \d\d:\d\d$/.test(s.last||'')&&s.last>sv);
    return{d,py,s,h,k,tx,saved:sv,mism}})})}
const dhBad=x=>['none','fail','old','late'].includes(x.k);
function dhRecent(){return dhMemo('rec',()=>{const t=today(),inc=[],abs=[];
  for(let i=1;i<=7;i++){const d=addDays(t,-i);if(!isWork(d))continue;const D=dhDay(d);
    D.L.inc.forEach(it=>inc.push({e:it.e,d,w:it.x.why}));D.L.absent.filter(it=>!it.x.rec).forEach(it=>abs.push({e:it.e,d,w:it.x.why}))}
  return{inc,abs}})}

/* التنبيهات الإدارية: وصف + أهمية + جهة مسؤولة + رابط للصفحة المعنية */
function dhAlerts(){return dhMemo('al',()=>{
  const A=[],t=today(),add=(key,sev,res,title,desc,tabs,cols,rows)=>A.push({key,sev,res,title,desc,tabs:tabs||{},cols:cols||null,rows:rows||null});
  const R=dhRecent(),pun=dhPun(),devs=dhDevs(),ds=['الموظف','القسم','التاريخ','السبب'];
  const uq=a=>new Set(a.map(x=>x.e.empNo)).size,er=a=>a.map(x=>({n:x.e.empNo,c:[x.e.name,x.e.dept||'',x.d,x.w]}));
  if(R.inc.length)add('inc7','med',['fp','hr'],`بصمة ناقصة: ${uq(R.inc)} موظف (${R.inc.length} يوم) خلال آخر 7 أيام`,'غالبًا نسيان بصمة الخروج أو عطل بالجهاز. راجع السجل وصحّح الحالة.',{fp:'data',hr:'rep'},ds,er(R.inc));
  if(R.abs.length)add('abs7','med',['fp','hr'],`غياب بلا حالة مسجلة: ${uq(R.abs)} موظف (${R.abs.length} يوم) خلال آخر 7 أيام`,'لا توجد بصمة ولا إجازة/إيفاد. سجّل الحالة إن وُجد مبرر (قد يحتاج سجل الدوام إلى تصحيح).',{fp:'case',hr:'rep'},ds,er(R.abs));
  devs.forEach(x=>{
    if(x.k==='none')add('dv_'+x.d.id,'high',['admin','fp'],`الجهاز «${x.d.name}» لم يرسل بيانات إطلاقًا`,'لم تصل أي حالة سحب من الوسيط. تأكد أن الوسيط يعمل وأن الجهاز معرّف بالشكل الصحيح.',{admin:'dev',fp:'up'});
    else if(x.k==='fail')add('dv_'+x.d.id,'high',['admin','fp'],`فشل السحب من «${x.d.name}»`,x.s.err||'خطأ غير معروف',{admin:'dev',fp:'up'});
    else if(x.k==='old')add('dv_'+x.d.id,'high',['admin','fp'],`الجهاز «${x.d.name}» لم يرسل بيانات منذ ${Math.floor(x.h/24)} يوم`,'تحقق من الشبكة وتشغيل المهمة المجدولة للوسيط.',{admin:'dev',fp:'up'});
    else if(x.k==='late')add('dv_'+x.d.id,'med',['admin','fp'],`تأخر تحديث الجهاز «${x.d.name}» (${Math.floor(x.h)} ساعات)`,'لم يصل تحديث منذ أكثر من 3 ساعات.',{admin:'dev',fp:'up'});
    if(x.mism)add('mm_'+x.d.id,'med',['admin','fp'],`اختلاف بين الجهاز والمحفوظ: «${x.d.name}»`,`آخر حركة رآها الوسيط ${x.s.last} بينما آخر محفوظ في السجل ${x.saved||'—'}. قد يزول بعد التحديث؛ وإن استمر فراجع الوسيط.`,{admin:'dev',fp:'up'})});
  {const lk=DB.logs.filter(l=>l.ts>=addDays(t,-1)+' 00:00:00'&&/قفل الحساب مؤقتًا/.test(l.action));
   if(lk.length)add('lock24','high',['admin'],`${lk.length} حالة قفل حساب خلال 24 ساعة`,'محاولات دخول فاشلة متكررة قد تكون تخمين كلمة سر. راجع سجل الحركات وأنهِ جلسات الحساب أو غيّر كلمة سره إن لزم.',{admin:'log'});
   const stl=DB.users.filter(u=>u.active!==false&&u.must&&u.role!=='emp'&&u.created&&(Date.parse(t)-Date.parse(u.created.slice(0,10)))/864e5>=3);
   if(stl.length)add('stalepw','med',['admin'],`${stl.length} حساب إداري ما زال بكلمة سر ابتدائية منذ 3 أيام أو أكثر`,'لم يغيّر أصحابها الرمز الابتدائي: '+stl.map(u=>u.id).join('، '),{admin:'gen'})}
  const pl=DB.leaves.filter(l=>l.status==='معلق');
  if(pl.length){const old=pl.filter(l=>l.ts&&(Date.parse(t)-Date.parse(l.ts.slice(0,10)))/864e5>=3).length;
    add('lvp',old?'high':'med',['hr'],`${pl.length} طلب إجازة ينتظر المصادقة`,old?`${old} منها مضى عليها 3 أيام أو أكثر`:'بانتظار قرار مسؤول الموارد البشرية',{hr:'lv'},['الموظف','من','إلى','وقت الطلب','رقم الطلب'],pl.map(l=>({n:l.empNo,c:[(empBy(l.empNo)||{}).name||l.empNo,l.from,l.to,l.ts,l.id]})))}
  const nf=DB.employees.filter(e=>!fpsOf(e).length);
  if(nf.length)add('nofp','med',['hr'],`${nf.length} موظف غير مرتبط برقم بصمة`,'لن تُحتسب لهم بصمات ويظهرون غائبين. أضف رقم البصمة من «رفع الموظفين».',{hr:'up'},['الموظف','القسم','رقم الموظف'],nf.map(e=>({n:e.empNo,c:[e.name,e.dept||'',e.empNo]})));
  const uk=Object.keys(pun.unm);
  if(uk.length)add('unm','med',['fp','admin'],`${uk.length} رقم بصمة ورد بلا موظف مرتبط (${pun.unmN} حركة)`,'قد يكون رقمًا مدخلًا خطأ أو موظفًا جديدًا لم يُسجَّل.',{fp:'data'},['رقم البصمة','عدد الحركات','آخر حركة'],uk.map(k=>({n:null,c:[k,pun.unm[k].n,pun.unm[k].last]})));
  const ce=DB.cases.filter(c=>c.to>=t&&c.to<=addDays(t,3));
  if(ce.length)add('endsoon','low',['hr','fp'],`${ce.length} حالة وظيفية تنتهي خلال 3 أيام`,'سيعود الموظف لاحتساب الحضور العادي بعد الانتهاء.',{fp:'case'},['الموظف','الحالة','من','إلى'],ce.map(c=>({n:c.empNo,c:[(empBy(c.empNo)||{}).name||c.empNo,c.type,c.from,c.to]})));
  const bk=(DB.stats&&DB.stats.backup)||{};
  if(bk.err)add('bkp','high',['admin'],'فشل آخر نسخة احتياطية',bk.err,{admin:'sys'});
  else if(DB.employees.length&&!bk.ok)add('bkp','low',['admin'],'لا توجد نسخة احتياطية مسجلة بعد','حدّث Code.gs إلى v3.2؛ تُنشأ النسخة تلقائيًا عند أول حفظ.',{admin:'sys'});
  const oe=DB.errors.filter(e=>!e.fixed);
  if(oe.length)add('errs',oe.length>10?'med':'low',['admin'],`${oe.length} خطأ تقني غير محلول`,'راجع سجل الأخطاء واضغط «تم الحل» بعد المعالجة.',{admin:'err'});
  const na=DB.employees.filter(e=>!DB.users.some(u=>u.role==='emp'&&u.empNo===e.empNo));
  if(na.length)add('noacct','low',['hr'],`${na.length} موظف بلا حساب دخول`,'ولّد لهم معرّفات من «معرّفات الموظفين».',{hr:'cred'},['الموظف','القسم','رقم الموظف'],na.map(e=>({n:e.empNo,c:[e.name,e.dept||'',e.empNo]})));
  const o={high:0,med:1,low:2};return A.sort((a,b)=>o[a.sev]-o[b.sev])})}
const dhMine=()=>dhAlerts().filter(a=>S.role==='admin'||a.res.includes(S.role));
const dhCan=k=>!!k&&TABS[S.role].some(t=>t.k===k);

/* ---------- نوافذ منبثقة ---------- */

  m.innerHTML=`<div class="modal" onclick="if(event.target===this)dhClose()"><div class="card wide"><h3>${title}<button class="btn sm sec" style="margin-right:auto" onclick="dhClose()">✕ إغلاق</button></h3>${body}</div></div>`}

document.addEventListener('keydown',e=>{if(e.key==='Escape')dhClose()});
document.addEventListener('click',e=>{const b=$('#gsr');if(b&&!e.target.closest('.gs'))b.innerHTML=''});

function dhXls(){const L=dhList();dlX('report_'+DQ.k+'_'+DQ.d+'.xlsx',[['رقم','الموظف','القسم','الحالة','الدخول','الخروج','السبب'],...L.rows.map(r=>r.c)]);log('تصدير قائمة لوحة المعلومات')}
function dhLab(x){const r=x.r;if(x.k==='att'||x.k==='in'){const a=[];if(x.k==='in')a.push('داخل الدوام');if(x.late)a.push('متأخر');if(x.early)a.push('خروج مبكر');return a.length?a.join(' + '):'حاضر'}return{absent:'غائب',inc:'بصمة ناقصة',pend:'لم يبصم بعد',case:r.st}[x.k]||r.st}

function dhOpen(k,d,dept){DQ={k:k||'all',d:d||dhDays().cur||today(),dept:dept||''};dhModal()}

  const L=dhList(),depts=[...new Set(DB.employees.map(e=>e.dept).filter(Boolean))].sort();

/* ===================== تصدير موحّد: Excel / Word / PDF ===================== */
function dl(name,blob){const u=URL.createObjectURL(blob);if(navigator.msSaveOrOpenBlob){navigator.msSaveOrOpenBlob(blob,name);return}const a=document.createElement('a');a.href=u;a.download=name;a.rel='noopener';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},4000)}
const XCSS='table{border-collapse:collapse;width:100%}th,td{border:1px solid #555;padding:4px 6px;font-size:12px;text-align:right}th{background:#d9e7e4}h2{margin:0 0 4px}';
function dlW(name,inner){dl(name,new Blob(['\ufeff<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" dir="rtl"><head><meta charset="utf-8"><style>@page{size:A4 landscape;margin:1.2cm}body{font-family:Arial,Tahoma;direction:rtl}'+XCSS+'</style></head><body>'+inner+'</body></html>'],{type:'application/msword'}))}
function dlP(name,inner){dlPdf('<style>'+XCSS+'</style>'+inner,name)}
function xHtml(title,head,rows){return '<h2>'+esc(title)+'</h2><p>'+esc(nowStr())+'</p><table><thead><tr>'+head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function xOut(k,title,head,rows){const nm=title.replace(/\s+/g,'_')+'_'+today();if(k==='x')dlX(nm+'.xlsx',[head,...rows]);else if(k==='w')dlW(nm+'.doc',xHtml(title,head,rows));else dlP(nm+'.pdf',xHtml(title,head,rows))}
function xbar(){
  let b=document.getElementById('xbar');
  const ok=S&&[...document.querySelectorAll('#root .tw table')].some(t=>t.rows.length>1);
  if(!ok){if(b)b.remove();return}
  if(!b){b=document.createElement('div');b.id='xbar';b.innerHTML='<span>تصدير الصفحة</span><button type="button" onclick="xAll(\'x\')">Excel</button><button type="button" onclick="xAll(\'w\')">Word</button><button type="button" onclick="xAll(\'p\')">PDF</button>';document.body.appendChild(b)}
}
function xAll(k){
  const ts=[...document.querySelectorAll('#root .tw table')].filter(t=>t.rows.length>1&&t.offsetParent!==null);
  if(!ts.length)return msg('لا توجد جداول في هذه الصفحة',1);
  const act=document.querySelector('nav.side button.on'),title=((act?act.textContent:'تقرير').replace(/[^\u0600-\u06FFa-zA-Z0-9 ]/g,'').trim())||'تقرير',name=title.replace(/\s+/g,'_')+'_'+today();
  try{
    if(k==='x'){const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};ts.slice(0,20).forEach((t,i)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.table_to_sheet(t),('جدول'+(i+1)).slice(0,31)));XLSX.writeFile(wb,name+'.xlsx');return}
    const inner='<h2>'+esc(title)+'</h2><p>'+esc(nowStr())+'</p>'+ts.map(t=>{const c=t.cloneNode(true);c.querySelectorAll('button,input,select,script').forEach(x=>x.remove());c.querySelectorAll('tr').forEach(r=>r.style.display='');return c.outerHTML}).join('<br>');
    if(k==='w')dlW(name+'.doc',inner);else dlP(name+'.pdf',inner);
  }catch(e){msg('تعذر التصدير: '+e.message,1)}
}

function saveNight(){

function addSub(){

/* ===================== الحارس الليلي: بصماته على الأجهزة الثلاثة ===================== */
function guardDevs(e){const s=new Set();(DB.fpmap||[]).forEach(r=>{if(r.empNo===e.empNo&&r.dev)s.add(r.dev)});return [...s]}
function guardNote(e,P){
  const g=guardDevs(e);if(g.length<3||!P.all.length)return '';
  const miss=g.filter(dv=>!P.all.some(p=>p.dev===dv)).length;
  const parts=g.map(dv=>{const t=[...new Set(P.all.filter(p=>p.dev===dv).map(p=>p.t))].sort();return dv+': '+(t.length?t.join('، '):'✗ لا بصمة')});
  return 'بصمات الحارس ('+(g.length-miss)+'/'+g.length+' أجهزة): '+parts.join(' ؛ ')+(miss?' — جولة ناقصة':'');
}

const UX={from:'',to:'',emp:'',devs:null,mode:'union',head:[],rows:[],err:''};
function uxDevs(){const s=new Set();DB.devices.filter(d=>!d.arch).forEach(d=>s.add(d.name));(DB.fpmap||[]).forEach(r=>s.add(r.dev));return [...s].filter(Boolean).sort()}
function uxSet(k,v){UX[k]=v;render()}
function uxTog(dv,on){const c=UX.devs||uxDevs();UX.devs=on?[...new Set(c.concat(dv))]:c.filter(x=>x!==dv);render()}
function uxBuild(){
  const sel=UX.devs||uxDevs(),from=UX.from||addDays(today(),-6),to=UX.to||today(),days=range(from,to),rows=[],all=!UX.emp;
  UX.err='';UX.rows=[];UX.head=['اليوم','التاريخ'].concat(all?['الموظف']:[],['وقت الدخول','وقت الخروج','الملاحظات','الحالة']);
  if(!sel.length){UX.err='اختر جهازًا واحدًا على الأقل';return[]}
  if(all&&days.length>62){UX.err='عند اختيار «كل الموظفين» لا يتجاوز المدى 62 يومًا';return[]}
  (all?DB.employees:DB.employees.filter(e=>e.empNo===UX.emp)).forEach(e=>days.forEach(d=>{
    const r=dayInfo(e,d),P=r.pn,got=P?[...new Set(P.all.map(p=>p.dev).filter(Boolean))]:[],hit=sel.filter(x=>got.includes(x));
    if(UX.mode==='inter'){if(!hit.length||hit.length<sel.length)return}
    else if(all&&!hit.length)return;
    const per=P&&P.all.length?'الأجهزة — '+sel.map(x=>x+': '+([...new Set(P.all.filter(p=>p.dev===x).map(p=>p.t))].sort().join('، ')||'—')).join(' ؛ '):'';
    const nt=(r.notes||[]).concat(per?[per]:[]).join(' | ');
    rows.push({r,cells:[r.day,d].concat(all?[e.name]:[],[r.in||'—',r.out||'—',nt,r.st+(r.fx?' (مصحّح)':'')])});
  }));
  UX.rows=rows.map(x=>x.cells);return rows;
}
function uxExp(k){if(!UX.rows.length)return msg('لا توجد بيانات للتصدير',1);xOut(k,'الاتحاد والتقاطع بين الأجهزة '+(UX.mode==='inter'?'(تقاطع)':'(اتحاد)')+' '+(UX.from||'')+'_'+(UX.to||''),UX.head,UX.rows)}

  if(!UX.from)UX.from=addDays(today(),-6);if(!UX.to)UX.to=today();

  const body=rows.map(x=>{const c=x.cells,n=all?1:0;return [c[0],`<span dir="ltr">${c[1]}</span>`].concat(all?[esc(c[2])]:[],[`<span dir="ltr">${c[2+n]}</span>`,`<span dir="ltr">${c[3+n]}</span>`,`<small>${esc(c[4+n])}</small>`,tg(x.r)])});

   `<div><label>من تاريخ</label><input type="date" value="${UX.from}" max="${today()}" onchange="uxSet('from',this.value)"></div><div><label>إلى تاريخ</label><input type="date" value="${UX.to}" max="${today()}" onchange="uxSet('to',this.value)"></div>`+
   `<div><label>الموظف</label><select onchange="uxSet('emp',this.value)"><option value="">كل الموظفين</option>${empOpts(UX.emp)}</select></div>`+
   `<div><label>الوضع</label><select onchange="uxSet('mode',this.value)"><option value="union" ${UX.mode==='union'?'selected':''}>اتحاد الأجهزة</option><option value="inter" ${UX.mode==='inter'?'selected':''}>تقاطع الأجهزة</option></select></div></div>`+
   `<div style="margin:8px 0"><label>الأجهزة:</label> ${dv.map(d=>`<label style="display:inline-block;margin-inline-end:14px"><input type="checkbox" ${sel.includes(d)?'checked':''} onchange="uxTog('${esc(d).replace(/'/g,'')}',this.checked)"> ${esc(d)}</label>`).join('')||'<span>لا توجد أجهزة</span>'}</div>`+
   (UX.err?`<div class="msg err">${esc(UX.err)}</div>`:`<p><b>${rows.length}</b> سطر</p>`)+
   tbl(UX.head,body)+
   `<button class="btn" onclick="uxExp('x')">تصدير Excel</button><button class="btn sec" onclick="uxExp('w')">تصدير Word</button><button class="btn sec" onclick="uxExp('p')">تصدير PDF</button></div>`;
}
